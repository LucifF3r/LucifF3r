[package]
name = "aslmotors-pos"
version = "1.0.0"
description = "ASL Motors POS"
authors = ["Palm Isle Collectives"]
edition = "2021"

# The library that Tauri loads. Keep the name in sync with lib.rs.
[lib]
name = "aslmotors_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# This feature is used for production builds or when a dev server is not specified.
custom-protocol = ["tauri/custom-protocol"]
