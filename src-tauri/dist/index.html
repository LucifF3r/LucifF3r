<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ASL Motors POS</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #141414;
        color: #fafafa;
      }
      .card {
        max-width: 30rem;
        padding: 2.5rem;
        text-align: center;
      }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { color: #a3a3a3; line-height: 1.6; margin: 0 0 1.5rem; }
      .dot { color: #da2128; }
      button {
        border: 0;
        background: #da2128;
        color: #ffffff;
        font-weight: 600;
        padding: 0.65rem 1.25rem;
        border-radius: 0.5rem;
        cursor: pointer;
        font-size: 0.95rem;
      }
      button:hover { background: #b91c22; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>ASL Motors <span class="dot">POS</span></h1>
      <p>
        Could not reach the app. Please check your internet connection, then
        try again.
      </p>
      <button onclick="location.href='https://revcycle-iota.vercel.app'">Retry</button>
    </div>
  </body>
</html>
